<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Causal chain from symptom to root cause</title>
<desc>Three findings linked left to right: a pending pod is caused by a pending persistent volume claim, which is caused by a storage class with no provisioner. Each finding has a dashed line down to the evidence record that supports it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="50" width="170" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="125" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">Pod pending</text>
<text x="125" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">symptom</text>

<rect x="255" y="50" width="170" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">PVC pending</text>
<text x="340" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">nothing bound it</text>

<rect x="470" y="50" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="555" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C">No provisioner</text>
<text x="555" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">root cause</text>

<line x1="212" y1="78" x2="247" y2="78" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="427" y1="78" x2="462" y2="78" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="125" y1="106" x2="125" y2="148" stroke="#9c9a92" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="340" y1="106" x2="340" y2="148" stroke="#9c9a92" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="555" y1="106" x2="555" y2="148" stroke="#9c9a92" stroke-width="0.5" stroke-dasharray="4 4"/>

<rect x="40" y="152" width="170" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="125" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">ev-1 scheduler msg</text>
<rect x="255" y="152" width="170" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">ev-2 pvc status</text>
<rect x="470" y="152" width="170" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="555" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">ev-3 storageclass</text>

<text x="340" y="214" text-anchor="middle" font-size="12" fill="#73726c">Arrows follow causedBy. The terminal node is the answer.</text>
</svg>
